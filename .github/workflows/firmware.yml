name: firmware

on:
  workflow_dispatch:
    inputs:
      pump_id:
        description: "Серийный номер помпы (переопределяет secret PUMP_ID)"
        required: false
        type: string
      pump_frequency:
        description: "Частота помпы в Гц (по умолчанию 868250000)"
        required: false
        type: string
      ble_name:
        description: "BLE-имя устройства (макс. 8 символов, по умолчанию MYGN)"
        required: false
        type: string
  push:
    branches: [main, ota]
    tags: ["v*"]
    paths-ignore: ["**.md"]

# Отменяем устаревший запуск при новом пуше в ту же ветку/тег
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Штамп версии: подставляем короткий SHA коммита в version.h,
      # чтобы на плате/в логе была видна точная сборка
      - name: Stamp build version
        shell: bash
        run: |
          SHA="${GITHUB_SHA::7}"
          sed -i "s|^#define FW_GIT_SHA[[:space:]].*|#define FW_GIT_SHA \"$SHA\"|" main/version.h
          grep FW_GIT_SHA main/version.h

      # Если задан секрет PUMP_ID — генерируем pump_config.h из секретов,
      # иначе берём файл из репозитория (для тестовых сборок).
      - name: Configure pump settings
        shell: bash
        env:
          PUMP_ID: ${{ inputs.pump_id || secrets.PUMP_ID }}
          PUMP_FREQUENCY: ${{ inputs.pump_frequency || secrets.PUMP_FREQUENCY }}
        run: |
          if [ -n "$PUMP_ID" ]; then
            # Серийник Medtronic — ровно 6 цифр; ошибку ловим до сборки, а не на железе
            if ! [[ "$PUMP_ID" =~ ^[0-9]{6}$ ]]; then
              echo "::error::PUMP_ID must be exactly 6 digits, got: '$PUMP_ID'"
              exit 1
            fi
            echo "::add-mask::$PUMP_ID"
            printf '#ifndef PUMP_CONFIG_H\n#define PUMP_CONFIG_H\n\n#define PUMP_ID\t\t"%s"\t// pump serial number\n#define PUMP_FREQUENCY\t%s\t// working pump frequency\n\n#endif\n' \
              "$PUMP_ID" "${PUMP_FREQUENCY:-868250000}" > include/pump_config.h
            echo "pump_config.h generated (source: workflow input or secrets)"
          else
            echo "::warning::PUMP_ID not set — using pump_config.h from the repo"
          fi

      # Плата TTGO LoRa32 V1.6.1 выбрана по умолчанию в include/module.h —
      # отдельный шаг выбора платы не нужен.

      # BLE-имя устройства (если задано при запуске)
      - name: Configure BLE name
        if: ${{ inputs.ble_name != '' }}
        shell: bash
        env:
          BLE_NAME: ${{ inputs.ble_name }}
        run: |
          NAME="${BLE_NAME:0:8}"
          sed -i "s|^#define BLE_NAME[[:space:]].*|#define BLE_NAME        \"${NAME}\"|" include/module.h
          echo "BLE_NAME set to ${NAME}"

      - name: Build firmware (ESP-IDF v5.4.1, target esp32)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32
          command: idf.py build && idf.py merge-bin -o rileylink-ttgo.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rileylink-ttgo
          path: build/rileylink-ttgo.bin
          retention-days: 30

      # Образ приложения для OTA-обновления (заливается через Wi-Fi,
      # страница http://192.168.4.1 в режиме OTA)
      - name: Upload OTA app image
        uses: actions/upload-artifact@v4
        with:
          name: rileylink-ttgo-ota
          path: build/pickle-stable.bin
          retention-days: 30

      # ELF + MAP нужны для декодирования backtrace (addr2line) при крэшах на железе
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: rileylink-ttgo-debug
          path: |
            build/pickle-stable.elf
            build/pickle-stable.map
          retention-days: 30

      # Релиз создаётся при пуше тега вида v* (например v0.1)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/rileylink-ttgo.bin
          generate_release_notes: true
